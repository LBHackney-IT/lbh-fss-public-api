version: 2.1

orbs:
  aws_assume_role: lbh-hackit/aws_assume_role@0.1.1
  sonarcloud: sonarsource/sonarcloud@4.0.0

executors:
  assume-role:
    docker:
      - image: cimg/base:current
  docker-compose:
    docker:
      - image: cimg/python:3.11
  docker-terraform:
    docker:
      - image: hashicorp/terraform:1.14
  docker-dotnet:
    docker:
      - image: mcr.microsoft.com/dotnet/sdk:8.0

references:
  workspace_root: &workspace_root "~"
  attach_workspace: &attach_workspace
    attach_workspace:
      at: *workspace_root

commands:
  assume-role-and-persist-workspace:
    description: "Assumes deployment role and persists credentials across jobs"
    parameters:
      aws-account:
        type: string
    steps:
      - checkout
      - aws_assume_role/assume_role:
          account: <<parameters.aws-account>>
          profile_name: default
          role: "LBH_Circle_CI_Deployment_Role"
      - persist_to_workspace:
          root: *workspace_root
          paths:
            - .aws

  deploy-lambda:
    description: "Deploys API via Serverless"
    parameters:
      stage:
        type: enum
        enum: ["development", "staging", "production"]
      aws-central-parameter-account:
        type: enum
        enum: ["AWS_ACCOUNT_DEVELOPMENT", "AWS_ACCOUNT_STAGING", "AWS_ACCOUNT_PRODUCTION"]
    steps:
      - *attach_workspace
      - checkout
      - run:
          name: Install Node.js
          command: |
            apt-get update
            apt-get install -y curl ca-certificates
            curl -fsSL https://deb.nodesource.com/setup_24.x | bash -
            apt-get install -y nodejs
      - run:
          name: Build and deploy lambda
          working_directory: ./LBHFSSPublicAPI/
          command: |
            set -e
            CENTRAL_ACCOUNT=${<<parameters.aws-central-parameter-account>>}
            chmod +x ./build.sh
            ./build.sh
            npx --yes serverless@4 deploy \
              --stage <<parameters.stage>> \
              --param="centralAccount=${CENTRAL_ACCOUNT}" \
              --conceal

  migrate-database:
    description: "Applies pending EF Core migrations via SSH tunnel to RDS"
    parameters:
      stage:
        type: enum
        enum: ["development", "staging", "production"]
      aws-central-parameter-account:
        type: enum
        enum: ["AWS_ACCOUNT_DEVELOPMENT", "AWS_ACCOUNT_STAGING", "AWS_ACCOUNT_PRODUCTION"]
    steps:
      - *attach_workspace
      - checkout
      - run:
          name: Install dependencies
          command: |
            apt-get update
            apt-get install -y unzip openssh-client curl awscli
            curl "https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb" -o "session-manager-plugin.deb"
            dpkg -i session-manager-plugin.deb
      - run:
          name: Install dotnet ef core
          command: dotnet tool install dotnet-ef --tool-path ./dotnet-ef-local/
      - run:
          name: Restore dotnet packages
          command: dotnet restore ./LBHFSSPublicAPI/LBHFSSPublicAPI.csproj
      - run:
          name: SSH into RDS and migrate database
          command: |
            CENTRAL_ACCOUNT=${<<parameters.aws-central-parameter-account>>}
            aws ssm get-parameter --name "/platform-apis-jump-box-pem-key" --with-decryption --output text --query Parameter.Value > ./private-key.pem
            chmod 400 ./private-key.pem
            HOST=$(aws ssm get-parameter --name arn:aws:ssm:eu-west-2:${CENTRAL_ACCOUNT}:parameter/<<parameters.stage>>apis/fss-public-api-<<parameters.stage>>/fss-public-api/postgres-hostname --query Parameter.Value --output text)
            PORT=$(aws ssm get-parameter --name arn:aws:ssm:eu-west-2:${CENTRAL_ACCOUNT}:parameter/<<parameters.stage>>apis/fss-public-api-<<parameters.stage>>/fss-public-api/postgres-port --query Parameter.Value --output text)
            INSTANCE_NAME=$(aws ssm get-parameter --name arn:aws:ssm:eu-west-2:${CENTRAL_ACCOUNT}:parameter/<<parameters.stage>>apis/<<parameters.stage>>-apis/<<parameters.stage>>apis/jump-box-instance-name --query Parameter.Value --output text)
            ssh -4 -i ./private-key.pem -Nf -M -L 6000:${HOST}:${PORT} -o "UserKnownHostsFile=/dev/null" -o "StrictHostKeyChecking=no" -o ProxyCommand="aws ssm start-session --target %h --document AWS-StartSSHSession --parameters portNumber=%p --region=eu-west-2" ec2-user@${INSTANCE_NAME}
            PASSWORD=$(aws ssm get-parameter --name /fss-public-api/<<parameters.stage>>/postgres-password --with-decryption --query Parameter.Value --output text)
            USERNAME=$(aws ssm get-parameter --name /fss-public-api/<<parameters.stage>>/postgres-username --query Parameter.Value --output text)
            DATABASE=$(aws ssm get-parameter --name arn:aws:ssm:eu-west-2:${CENTRAL_ACCOUNT}:parameter/<<parameters.stage>>apis/fss-public-api-<<parameters.stage>>/fss-public-api/postgres-database --query Parameter.Value --output text)
            ADDRESSES_URL=$(aws ssm get-parameter --name arn:aws:ssm:eu-west-2:${CENTRAL_ACCOUNT}:parameter/<<parameters.stage>>apis/<<parameters.stage>>-apis/<<parameters.stage>>apis/addresses-api-base-url --query Parameter.Value --output text)
            ADDRESSES_KEY=$(aws ssm get-parameter --name /fss-public-api/<<parameters.stage>>/addresses-api-key --with-decryption --query Parameter.Value --output text)
            ADDRESSES_API_TOKEN=$(aws ssm get-parameter --name /fss-common-api/<<parameters.stage>>/addresses-api-token --query Parameter.Value --output text)
            CONN_STR="Host=localhost;Password=${PASSWORD};Port=6000;Username=${USERNAME};Database=${DATABASE}"
            cd ./LBHFSSPublicAPI/
            ADDRESSES_API_BASE_URL=${ADDRESSES_URL} ADDRESSES_API_KEY=${ADDRESSES_KEY} ADDRESSES_API_TOKEN=${ADDRESSES_API_TOKEN} CONNECTION_STRING=${CONN_STR} ./../dotnet-ef-local/dotnet-ef database update

  preview-migrations:
    description: "List pending database migrations"
    parameters:
      stage:
        type: enum
        enum: ["development", "staging", "production"]
      aws-central-parameter-account:
        type: enum
        enum: ["AWS_ACCOUNT_DEVELOPMENT", "AWS_ACCOUNT_STAGING", "AWS_ACCOUNT_PRODUCTION"]
    steps:
      - *attach_workspace
      - checkout
      - run:
          name: Install dependencies
          command: |
            apt-get update
            apt-get install -y unzip openssh-client curl awscli
            curl "https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb" -o "session-manager-plugin.deb"
            dpkg -i session-manager-plugin.deb
      - run:
          name: Install dotnet ef core
          command: dotnet tool install dotnet-ef --tool-path ./dotnet-ef-local/
      - run:
          name: Restore dotnet packages
          command: dotnet restore ./LBHFSSPublicAPI/LBHFSSPublicAPI.csproj
      - run:
          name: List pending migrations
          command: |
            CENTRAL_ACCOUNT=${<<parameters.aws-central-parameter-account>>}
            aws ssm get-parameter --name "/platform-apis-jump-box-pem-key" --with-decryption --output text --query Parameter.Value > ./private-key.pem
            chmod 400 ./private-key.pem
            HOST=$(aws ssm get-parameter --name arn:aws:ssm:eu-west-2:${CENTRAL_ACCOUNT}:parameter/<<parameters.stage>>apis/fss-public-api-<<parameters.stage>>/fss-public-api/postgres-hostname --query Parameter.Value --output text)
            PORT=$(aws ssm get-parameter --name arn:aws:ssm:eu-west-2:${CENTRAL_ACCOUNT}:parameter/<<parameters.stage>>apis/fss-public-api-<<parameters.stage>>/fss-public-api/postgres-port --query Parameter.Value --output text)
            INSTANCE_NAME=$(aws ssm get-parameter --name arn:aws:ssm:eu-west-2:${CENTRAL_ACCOUNT}:parameter/<<parameters.stage>>apis/<<parameters.stage>>-apis/<<parameters.stage>>apis/jump-box-instance-name --query Parameter.Value --output text)
            ssh -4 -i ./private-key.pem -Nf -M -L 6000:${HOST}:${PORT} -o "UserKnownHostsFile=/dev/null" -o "StrictHostKeyChecking=no" -o ProxyCommand="aws ssm start-session --target %h --document AWS-StartSSHSession --parameters portNumber=%p --region=eu-west-2" ec2-user@${INSTANCE_NAME}
            PASSWORD=$(aws ssm get-parameter --name /fss-public-api/<<parameters.stage>>/postgres-password --with-decryption --query Parameter.Value --output text)
            USERNAME=$(aws ssm get-parameter --name /fss-public-api/<<parameters.stage>>/postgres-username --query Parameter.Value --output text)
            DATABASE=$(aws ssm get-parameter --name arn:aws:ssm:eu-west-2:${CENTRAL_ACCOUNT}:parameter/<<parameters.stage>>apis/fss-public-api-<<parameters.stage>>/fss-public-api/postgres-database --query Parameter.Value --output text)
            ADDRESSES_URL=$(aws ssm get-parameter --name arn:aws:ssm:eu-west-2:${CENTRAL_ACCOUNT}:parameter/<<parameters.stage>>apis/<<parameters.stage>>-apis/<<parameters.stage>>apis/addresses-api-base-url --query Parameter.Value --output text)
            ADDRESSES_KEY=$(aws ssm get-parameter --name /fss-public-api/<<parameters.stage>>/addresses-api-key --with-decryption --query Parameter.Value --output text)
            ADDRESSES_API_TOKEN=$(aws ssm get-parameter --name /fss-common-api/<<parameters.stage>>/addresses-api-token --query Parameter.Value --output text)
            CONN_STR="Host=localhost;Password=${PASSWORD};Port=6000;Username=${USERNAME};Database=${DATABASE}"
            cd ./LBHFSSPublicAPI/
            ADDRESSES_API_BASE_URL=${ADDRESSES_URL} ADDRESSES_API_KEY=${ADDRESSES_KEY} ADDRESSES_API_TOKEN=${ADDRESSES_API_TOKEN} CONNECTION_STRING=${CONN_STR} ./../dotnet-ef-local/dotnet-ef migrations list

  preview-terraform:
    description: "Previews terraform configuration changes"
    parameters:
      environment:
        type: enum
        enum: ["development", "staging", "production"]
    steps:
      - *attach_workspace
      - checkout
      - run:
          name: Preview terraform
          command: |
            terraform init \
              -backend-config="bucket=terraform-state-<<parameters.environment>>-apis" \
              -backend-config="key=services/fss-public-api/terraform.tfstate"
            terraform validate
            terraform plan -var="environment=<<parameters.environment>>"

  deploy-terraform:
    description: "Initializes and applies terraform configuration"
    parameters:
      environment:
        type: enum
        enum: ["development", "staging", "production"]
    steps:
      - *attach_workspace
      - checkout
      - run:
          name: Initialize and apply terraform
          command: |
            terraform init \
              -backend-config="bucket=terraform-state-<<parameters.environment>>-apis" \
              -backend-config="key=services/fss-public-api/terraform.tfstate"
            terraform validate
            terraform apply -auto-approve -var="environment=<<parameters.environment>>"

jobs:
  check-code-formatting:
    executor: docker-dotnet
    steps:
      - checkout
      - run:
          name: Install dotnet format
          command: dotnet tool install dotnet-format --tool-path ./dotnet-format-local/
      - run:
          name: Run formatter check
          command: ./dotnet-format-local/dotnet-format --check

  build-and-test:
    executor: docker-compose
    steps:
      - checkout:
          method: full
      - setup_remote_docker
      - run:
          name: Start database
          command: |
            docker compose up -d test-database
            echo "Waiting for database to be ready..."
            timeout 60 sh -c 'until docker compose exec -T test-database pg_isready -U postgres; do sleep 2; done'
      - run:
          name: Build test image
          command: docker compose build fss-public-api-test
      - run:
          name: Run tests
          command: |
            docker compose run \
              -e ADDRESSES_API_BASE_URL -e ADDRESSES_API_KEY -e ADDRESSES_API_TOKEN \
              fss-public-api-test
      - run:
          name: Report
          command: |
            mkdir -p coverage test_results
            CID=$(docker ps -aqf "name=fss-public-api-test" | head -n1)
            if [ -z "${CID}" ]; then
              echo "No test container found matching name=fss-public-api-test"
              exit 1
            fi
            docker cp "${CID}:/app/coverage/." ./coverage/
            docker cp "${CID}:/app/test_results/." ./test_results/
            find coverage -name '*.opencover.xml' -exec sed -i "s|/app/|$(pwd)/|g" {} +
      - store_test_results:
          path: test_results
      - sonarcloud/scan
      - run:
          name: Cleanup
          when: always
          command: docker compose down -v

  assume-role-development:
    executor: assume-role
    steps:
      - assume-role-and-persist-workspace:
          aws-account: $AWS_ACCOUNT_DEVELOPMENT

  assume-role-staging:
    executor: assume-role
    steps:
      - assume-role-and-persist-workspace:
          aws-account: $AWS_ACCOUNT_STAGING

  assume-role-production:
    executor: assume-role
    steps:
      - assume-role-and-persist-workspace:
          aws-account: $AWS_ACCOUNT_PRODUCTION

  deploy-to-development:
    executor: docker-dotnet
    steps:
      - deploy-lambda:
          stage: "development"
          aws-central-parameter-account: "AWS_ACCOUNT_DEVELOPMENT"

  deploy-to-staging:
    executor: docker-dotnet
    steps:
      - deploy-lambda:
          stage: "staging"
          aws-central-parameter-account: "AWS_ACCOUNT_STAGING"

  deploy-to-production:
    executor: docker-dotnet
    steps:
      - deploy-lambda:
          stage: "production"
          aws-central-parameter-account: "AWS_ACCOUNT_PRODUCTION"

  migrate-database-development:
    executor: docker-dotnet
    steps:
      - migrate-database:
          stage: "development"
          aws-central-parameter-account: "AWS_ACCOUNT_DEVELOPMENT"

  migrate-database-staging:
    executor: docker-dotnet
    steps:
      - migrate-database:
          stage: "staging"
          aws-central-parameter-account: "AWS_ACCOUNT_STAGING"

  migrate-database-production:
    executor: docker-dotnet
    steps:
      - migrate-database:
          stage: "production"
          aws-central-parameter-account: "AWS_ACCOUNT_PRODUCTION"

  deploy-development-terraform:
    executor: docker-terraform
    steps:
      - deploy-terraform:
          environment: "development"

  deploy-staging-terraform:
    executor: docker-terraform
    steps:
      - deploy-terraform:
          environment: "staging"

  deploy-production-terraform:
    executor: docker-terraform
    steps:
      - deploy-terraform:
          environment: "production"

  preview-migrations-development:
    executor: docker-dotnet
    steps:
      - preview-migrations:
          stage: "development"
          aws-central-parameter-account: "AWS_ACCOUNT_DEVELOPMENT"

  preview-migrations-staging:
    executor: docker-dotnet
    steps:
      - preview-migrations:
          stage: "staging"
          aws-central-parameter-account: "AWS_ACCOUNT_STAGING"

  preview-migrations-production:
    executor: docker-dotnet
    steps:
      - preview-migrations:
          stage: "production"
          aws-central-parameter-account: "AWS_ACCOUNT_PRODUCTION"

  preview-development-terraform:
    executor: docker-terraform
    steps:
      - preview-terraform:
          environment: "development"

  preview-staging-terraform:
    executor: docker-terraform
    steps:
      - preview-terraform:
          environment: "staging"

  preview-production-terraform:
    executor: docker-terraform
    steps:
      - preview-terraform:
          environment: "production"

workflows:
  feature:
    jobs:
      - check-code-formatting:
          filters:
            branches:
              ignore: [master, chore/update-pem]

      - build-and-test:
          context:
            - find-support-services-public-api-context
            - SonarCloud
          requires: [check-code-formatting]
          filters:
            branches:
              ignore: [master, chore/update-pem]

      - assume-role-development:
          context: api-assume-role-development-context
          requires:
            - build-and-test
          filters:
            branches:
              ignore: [master, chore/update-pem]

      - preview-development-terraform:
          requires:
            - assume-role-development
          filters:
            branches:
              ignore: [master, chore/update-pem]

  check-and-deploy-development:
    jobs:
      - check-code-formatting:
          filters:
            branches:
              only: [chore/update-pem]

      - build-and-test:
          context:
            - find-support-services-public-api-context
            - SonarCloud
          requires: [check-code-formatting]
          filters:
            branches:
              only: [chore/update-pem]

      - permit-development-release:
          type: approval
          requires:
            - build-and-test
          filters:
            branches:
              only: [chore/update-pem]

      - assume-role-development:
          context: api-assume-role-development-context
          requires:
            - permit-development-release
          filters:
            branches:
              only: [chore/update-pem]

      - deploy-to-development:
          context:
            - "Serverless Framework"
            - central-parameter-store-context
          requires:
            - permit-development-release
            - assume-role-development
          filters:
            branches:
              only: [chore/update-pem]

  check-and-deploy-staging-and-production:
    jobs:
      - check-code-formatting:
          filters:
            branches:
              only: [master]

      - build-and-test:
          context:
            - find-support-services-public-api-context
            - SonarCloud
          requires: [check-code-formatting]
          filters:
            branches:
              only: [master]

      - permit-staging-release:
          type: approval
          requires:
            - build-and-test
          filters:
            branches:
              only: [master]

      - assume-role-staging:
          context: api-assume-role-staging-context
          requires:
            - permit-staging-release
          filters:
            branches:
              only: [master]

      - deploy-to-staging:
          context:
            - "Serverless Framework"
            - central-parameter-store-context
          requires:
            - permit-staging-release
            - assume-role-staging
          filters:
            branches:
              only: [master]

      - permit-production-release:
          type: approval
          requires:
            - deploy-to-staging
          filters:
            branches:
              only: [master]

      - assume-role-production:
          context: api-assume-role-production-context
          requires:
            - permit-production-release
          filters:
            branches:
              only: [master]

      - deploy-to-production:
          context:
            - "Serverless Framework"
            - central-parameter-store-context
          requires:
            - permit-production-release
            - assume-role-production
          filters:
            branches:
              only: [master]

  terraform-release:
    jobs:
      - assume-role-development:
          context: api-assume-role-development-context
          filters:
            branches:
              only: [chore/update-pem]

      - preview-development-terraform:
          requires:
            - assume-role-development
          filters:
            branches:
              only: [chore/update-pem]

      - permit-terraform-development-release:
          type: approval
          requires:
            - preview-development-terraform
          filters:
            branches:
              only: [chore/update-pem]

      - deploy-development-terraform:
          requires:
            - permit-terraform-development-release
          filters:
            branches:
              only: [chore/update-pem]

      - assume-role-staging:
          context: api-assume-role-staging-context
          filters:
            branches:
              only: [master]

      - preview-staging-terraform:
          requires:
            - assume-role-staging
          filters:
            branches:
              only: [master]

      - permit-terraform-staging-release:
          type: approval
          requires:
            - preview-staging-terraform
          filters:
            branches:
              only: [master]

      - deploy-staging-terraform:
          requires:
            - permit-terraform-staging-release
          filters:
            branches:
              only: [master]

      - assume-role-production:
          context: api-assume-role-production-context
          requires:
            - deploy-staging-terraform
          filters:
            branches:
              only: [master]

      - preview-production-terraform:
          requires:
            - assume-role-production
          filters:
            branches:
              only: [master]

      - permit-terraform-production-release:
          type: approval
          requires:
            - preview-production-terraform
          filters:
            branches:
              only: [master]

      - deploy-production-terraform:
          requires:
            - permit-terraform-production-release
          filters:
            branches:
              only: [master]

  database-migration:
    jobs:
      # Development migrations
      - assume-role-development:
          context: api-assume-role-development-context
          filters:
            branches:
              only: [chore/update-pem]
      - preview-migrations-development:
          context: central-parameter-store-context
          requires: [assume-role-development]
          filters:
            branches:
              only: [chore/update-pem]
      - permit-migration-development:
          type: approval
          requires: [preview-migrations-development]
          filters:
            branches:
              only: [chore/update-pem]
      - migrate-database-development:
          context: central-parameter-store-context
          requires: [permit-migration-development]
          filters:
            branches:
              only: [chore/update-pem]

      # Staging migrations
      - assume-role-staging:
          context: api-assume-role-staging-context
          filters:
            branches:
              only: [master]
      - preview-migrations-staging:
          context: central-parameter-store-context
          requires: [assume-role-staging]
          filters:
            branches:
              only: [master]
      - permit-migration-staging:
          type: approval
          requires: [preview-migrations-staging]
          filters:
            branches:
              only: [master]
      - migrate-database-staging:
          context: central-parameter-store-context
          requires: [permit-migration-staging]
          filters:
            branches:
              only: [master]

      # Production migrations
      - assume-role-production:
          context: api-assume-role-production-context
          filters:
            branches:
              only: [master]
      - preview-migrations-production:
          context: central-parameter-store-context
          requires: [assume-role-production]
          filters:
            branches:
              only: [master]
      - permit-migration-production:
          type: approval
          requires: [preview-migrations-production]
          filters:
            branches:
              only: [master]
      - migrate-database-production:
          context: central-parameter-store-context
          requires: [permit-migration-production]
          filters:
            branches:
              only: [master]
